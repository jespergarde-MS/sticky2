<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky navigation on scroll direction</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0;}
body { overflow-x: hidden; }
img { display: block; width: 375px; height: auto; }
.page, .nav-wrapper, .nav { width: 100%; }
.nav-wrapper { position: relative; }

.sticky-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: #fff;
    transform: translateY(-100%);
    pointer-events: none;
    visibility: hidden;
    will-change: transform;
    transition: transform 300ms ease;
}
.sticky-nav.is-active {
    visibility: visible;
    pointer-events: auto;
}
</style>
</head>
<body>
<div class="page">
    <img src="stripe.png" alt="">

    <div class="nav-wrapper">
        <div class="nav">
            <img id="navTop" src="nav-top.png" alt="">
            <img id="navBot" src="nav-bot.png" alt="">
        </div>
    </div>

    <img src="page.png" alt="">
</div>

<div class="sticky-nav" id="stickyNav" aria-hidden="true">
    <img id="stickyNavImage" src="nav-top.png" alt="">
</div>

<script>
const navTop = document.getElementById('navTop');
const stickyNav = document.getElementById('stickyNav');
const stickyNavImage = document.getElementById('stickyNavImage');

let stickyNavPinned = false;

function pinStickyNav() {
    stickyNavPinned = true;
    stickyNav.classList.add('is-active');
    stickyNav.setAttribute('aria-hidden', 'false');
    stickyNav.style.transform = 'translateY(0)';
}

function resetStickyNav() {
    stickyNavPinned = false;
    stickyNavImage.src = 'nav-top.png';
    stickyNav.classList.remove('is-active');
    stickyNav.style.transform = '';
    stickyNav.setAttribute('aria-hidden', 'true');
}

window.addEventListener('scroll', function () {
    const navTopPosition = navTop.getBoundingClientRect().top;

    if (navTopPosition <= 0) {
        pinStickyNav();
        stickyNavImage.src = navBot.getBoundingClientRect().bottom <= 0
            ? 'nav-bot-burger.png'
            : 'nav-top.png';
    } else if (stickyNavPinned) {
        resetStickyNav();
    }

}, { passive: true });

window.addEventListener('pageshow', function () {
    resetStickyNav();
});
</script>
</body>
</html>
